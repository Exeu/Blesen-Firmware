name: Build STM32 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies (ARM GCC, CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential \
            gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure (CMake, Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build target Blesen-Fw.elf
        run: |
          cmake --build build --target Blesen-Fw.elf -- -j

      - name: Prepare firmware artifacts (ELF -> BIN/HEX)
        shell: bash
        run: |
          set -euo pipefail
          # Try to locate the produced ELF
          ELF_PATH=""
          if [ -f "build/Blesen-Fw.elf" ]; then
            ELF_PATH="build/Blesen-Fw.elf"
          else
            # Fallback: search within build dir for any .elf
            ELF_PATH=$(find build -maxdepth 3 -type f -name "*.elf" | head -n1 || true)
          fi

          if [ -z "$ELF_PATH" ]; then
            echo "Error: Could not locate ELF output in build directory." >&2
            exit 1
          fi

          echo "Found ELF: $ELF_PATH"
          mkdir -p out
          cp "$ELF_PATH" out/Blesen-Fw.elf

          # Convert to .bin and .hex using ARM objcopy
          arm-none-eabi-objcopy -O binary "$ELF_PATH" out/Blesen-Fw.bin
          arm-none-eabi-objcopy -O ihex   "$ELF_PATH" out/Blesen-Fw.hex

          # Try to include map file if generated by the linker
          MAP_CANDIDATE=$(find build -maxdepth 5 -type f -name "*.map" | head -n1 || true)
          if [ -n "$MAP_CANDIDATE" ]; then
            cp "$MAP_CANDIDATE" out/
          fi

          echo "Artifacts prepared:"
          ls -l out

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-artifacts
          path: |
            out/Blesen-Fw.elf
            out/Blesen-Fw.bin
            out/Blesen-Fw.hex
            out/*.map
